# Push a version tag (git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3) and this workflow
# tests it, creates the GitHub release, and moves the major tag (v1) so `certshelf@v1` users get it.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: The tag matches the code's version
        env:
          PYTHONPATH: src
        run: |
          version=$(python -c "import certshelf; print(certshelf.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match certshelf.__version__ $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping it (the tag was pushed again)."
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
      - name: Move the major tag to this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "certshelf $major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
