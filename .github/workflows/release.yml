name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.1
        required: true
      marketplace:
        description: Create a draft to publish on the GitHub Marketplace
        type: boolean
        default: true
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: write

env:
  PACKAGE: certshelf

jobs:
  release:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version must look like 1.2.3, got '$v'"
            exit 1
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Set the version and tag it
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; choose a new version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" "src/$PACKAGE/__init__.py"
          if ! git diff --quiet; then
            git commit -qam "Release $TAG"
            git push -q origin "HEAD:$GITHUB_REF"
          fi
          git tag -a "$TAG" -m "$TAG"
          git push -q origin "$TAG"
      - name: The tag matches the code's version
        env:
          PYTHONPATH: src
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          version=$(python -c "import $PACKAGE; print($PACKAGE.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match $PACKAGE.__version__ $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.marketplace }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG"
            echo "Release $TAG already exists; kept it." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRAFT" = true ]; then
            url=$(gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --draft)
            {
              echo "### $TAG is ready as a draft"
              echo "1. Open [the draft]($url)."
              echo "2. Tick **Publish this Action to the GitHub Marketplace** and pick a category."
              echo "3. Click **Publish release**. The major tag moves when you do."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
            echo "Released $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Move the major tag
        if: github.event_name != 'workflow_dispatch' || !inputs.marketplace
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          major="${TAG%%.*}"
          git tag -fa "$major" -m "$PACKAGE $major" "$TAG^{commit}"
          git push -q --force origin "refs/tags/$major"

  published:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          major="${TAG%%.*}"
          git tag -fa "$major" -m "$PACKAGE $major" "$TAG^{commit}"
          git push -q --force origin "refs/tags/$major"
